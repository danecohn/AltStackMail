name: Verify production Mail portal image
on:
  push:
    branches: [main]
    paths: [Dockerfile, entrypoint.sh, .dockerignore, .github/workflows/portal-image.yml]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build verified released client and account portal
        run: docker build -t altstack-mail .
      - name: Verify persistent state and account gate
        run: |
          docker volume create mail-state
          docker run -d --name mail -p 3000:3000 -v mail-state:/data -e PUBLIC_ORIGIN=https://mail.example.test -e ALTSTACK_ORIGIN=https://platform.example.test -e MAIL_OIDC_SECRET=fixture-oidc-secret-not-for-production-12345 -e MAIL_SERVICE_SECRET=fixture-service-secret-not-for-production-12345 altstack-mail
          for attempt in $(seq 1 30); do curl -fsS http://localhost:3000/healthz && break; sleep 1; done
          test "$(curl -sS -o /tmp/gate.txt -w '%{http_code}' http://localhost:3000/mail)" = 303
          curl -fsS http://localhost:3000/about | grep -q 'Vigil Mail'
          docker exec mail test -s /data/mail.sqlite
          test "$(docker exec mail stat -c %U /data/mail.sqlite)" = node
      - name: Verify exact product artwork and compiled presentation
        run: |
          docker cp mail:/app/web/app.js /tmp/mail-app.js
          test "$(grep -o 'Cohnsoft' /tmp/mail-app.js | wc -l)" -eq 0
          docker cp mail:/app/web/sw.js /tmp/mail-sw.js
          grep -q 'CODE_CACHE-vigiltech-1.0.7-v' /tmp/mail-sw.js
          curl -fsS http://localhost:3000/vigiltech/product-icons/mail/web/favicon.ico -o /tmp/mail-favicon.ico
          cmp /tmp/mail-favicon.ico assets/vigiltech/product-icons/mail/web/favicon.ico
          curl -fsS http://localhost:3000/vigiltech/product-icons/calendar/web/maskable-512.png -o /tmp/calendar-maskable.png
          cmp /tmp/calendar-maskable.png assets/vigiltech/product-icons/calendar/web/maskable-512.png
      - name: Diagnostics
        if: always()
        run: docker logs mail || true

