name: Build AltStack Mail and Calendar
on:
  push:
    branches: [main]
    paths: ["assets/**", "desktop/**", "scripts/**", "upstream.json", "package*.json", ".github/workflows/release.yml", "release-notes.md", "portal/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: altstack-mail-release
  cancel-in-progress: true
jobs:
  portal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - name: Verify account login, PKCE, session isolation and logout
        working-directory: portal
        run: |
          npm ci --ignore-scripts
          npm test
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - name: Check out pinned Tuta source and submodules
        run: |
          git clone --depth 1 --branch tutanota-desktop-release-362.261023.2 https://github.com/tutao/tutanota.git upstream
          test "$(git -C upstream rev-parse HEAD)" = d589cf8c6f6855a314db39e059cffb464f805e19
          git -C upstream submodule update --init --recursive --depth 1
      - name: Prepare WebAssembly toolchain
        run: |
          git clone --depth 1 --branch 3.1.59 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install 3.1.59
          /tmp/emsdk/emsdk activate 3.1.59
          rustup target add wasm32-unknown-unknown
      - name: Apply AltStack presentation and build upstream browser client
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          source /tmp/emsdk/emsdk_env.sh
          export PATH="$RUNNER_TOOL_CACHE/node/24.22.1/x64/bin:$PATH"
          python3 scripts/brand.py upstream
          cd upstream
          npm ci
          node webapp prod --app mail
      - name: Assemble the real Mail and Calendar web app
        run: |
          mkdir web
          cp -R upstream/build/. web/
          cp assets/altstack.css assets/altstack.js web/
          cp LICENSE.txt THIRD-PARTY.md web/
          cp upstream/third-party.txt web/upstream-third-party.txt
          test -s web/index.html
          test -s web/app.js
          test -s web/worker.js
          tar -czf AltStackMail-web.tar.gz -C web .
          sha256sum AltStackMail-web.tar.gz > AltStackMail-web.tar.gz.sha256
          mkdir -p corresponding-source/altstack
          git archive HEAD | tar -x -C corresponding-source/altstack
          tar --exclude=.git --exclude=node_modules --exclude=build --exclude=cache --exclude=target -czf corresponding-source/tuta.tar.gz -C upstream .
          tar -czf AltStackMail-source.tar.gz -C corresponding-source .
          sha256sum AltStackMail-source.tar.gz > AltStackMail-source.tar.gz.sha256
      - name: Verify real Mail login and Calendar navigation on desktop and mobile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium
          node scripts/web-smoke.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: Mail-web-previews
          path: validation/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: Mail-web
          path: |
            AltStackMail-web.tar.gz*
            AltStackMail-source.tar.gz*
          if-no-files-found: error
  desktop:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            args: --win --x64
          - target: windows-arm64
            runner: windows-11-arm
            args: --win --arm64
          - target: macos-x64
            runner: macos-15-intel
            args: --mac --x64
          - target: macos-arm64
            runner: macos-15
            args: --mac --arm64
          - target: linux-x64
            runner: ubuntu-24.04
            args: --linux --x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            args: --linux --arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Package native installer
        shell: bash
        env:
          # macOS: with a Developer ID in the repository secrets the app is signed and notarized by Apple.
          # Without them it is re-sealed ad hoc (scripts/adhoc-sign.cjs): valid, but macOS asks for a one-time approval.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
        run: |
          # An absent secret arrives as an EMPTY variable, and electron-builder reads an empty CSC_LINK as "load a certificate from this path".
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do if [ -z "${!v}" ]; then unset "$v"; fi; done
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          EXTRA=""
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ] && [ "$RUNNER_OS" = "macOS" ]; then EXTRA="-c.mac.notarize=true"; fi
          npx electron-builder ${{ matrix.args }} --publish never $EXTRA
      - name: Verify the macOS app signature (a broken seal is what makes Finder say "damaged")
        if: runner.os == 'macOS'
        run: |
          mkdir -p validation
          APP=$(ls -d release/mac*/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Signature|Info.plist=' ; ! codesign -dv "$APP" 2>&1 | grep -q 'Info.plist=not bound'
          "$APP/Contents/MacOS/AltStack Mail" --smoke-test validation/packaged-mac.png
          test -s validation/packaged-mac.png
      - name: Verify desktop host launches
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p validation
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npx electron --no-sandbox --disable-gpu . --smoke-test validation/desktop-host.png
          else
            npx electron . --smoke-test validation/desktop-host.png
          fi
          test -s validation/desktop-host.png
      - name: Check installer and checksum
        shell: bash
        run: |
          python3 scripts/release.py '${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        with:
          name: Mail-${{ matrix.target }}
          path: artifacts/AltStackMail-*
          if-no-files-found: error
  publish:
    needs: [web,desktop,portal]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: Mail-*
          path: artifacts
          merge-multiple: true
      - name: Publish verified web app and all six installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(find artifacts -maxdepth 1 -type f -name 'AltStackMail-*' ! -name '*.sha256' | wc -l)" -eq 8
          VERSION="$(node -p "require('./package.json').version")"
          TAG="altstack-mail-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/AltStackMail-* --clobber
            gh release edit "$TAG" --title "AltStack Mail & Calendar ${VERSION}" --notes-file release-notes.md
          else
            gh release create "$TAG" artifacts/AltStackMail-* --target "$GITHUB_SHA" --title "AltStack Mail & Calendar ${VERSION}" --notes-file release-notes.md
          fi

